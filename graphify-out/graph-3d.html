<script>
const data = JSON.parse(document.getElementById("graph-data").textContent);
const palette = ["#ef4444","#f59e0b","#10b981","#3b82f6","#8b5cf6","#ec4899","#14b8a6","#f97316","#84cc16","#06b6d4","#a855f7","#eab308","#22c55e","#0ea5e9","#d946ef","#f43f5e","#fb923c","#a3e635","#22d3ee","#c084fc"];
const colorFor = c => palette[(c ?? 0) % palette.length];

const degree = {};
(data.links || []).forEach(l => {
  const s = typeof l.source === "object" ? l.source.id : l.source;
  const t = typeof l.target === "object" ? l.target.id : l.target;
  degree[s] = (degree[s] || 0) + 1;
  degree[t] = (degree[t] || 0) + 1;
});

const Graph = ForceGraph3D()(document.getElementById("graph"))
  .backgroundColor("#0b0b12")
  .graphData({ nodes: data.nodes, links: data.links })
  .nodeLabel(n => `<b>${n.label}</b><br><small style="color:#9ca3af">${n.source_file || ""}</small>`)
  .nodeColor(n => colorFor(n.community))
  .nodeVal(n => 1 + Math.sqrt(degree[n.id] || 1) * 1.5)
  .nodeOpacity(0.95)
  .linkColor(() => "rgba(180,180,200,0.22)")
  .linkOpacity(0.45)
  .linkWidth(0.6)
  .onNodeClick(node => {
    const distance = 100;
    const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
    Graph.cameraPosition(
      { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
      node, 1500
    );
    const info = document.getElementById("info");
    info.style.display = "block";
    const deg = degree[node.id] || 0;
    info.innerHTML = `<b>${node.label}</b><br>` +
      `<small>${node.source_file || "—"} · community ${node.community ?? "—"} · ${deg} connessioni</small>`;
  });

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const match = data.nodes.find(n =>
    (n.label || "").toLowerCase().includes(q) ||
    (n.source_file || "").toLowerCase().includes(q)
  );
  if (match && match.x != null) {
    const distRatio = 1 + 100 / Math.hypot(match.x, match.y, match.z);
    Graph.cameraPosition(
      { x: match.x * distRatio, y: match.y * distRatio, z: match.z * distRatio },
      match, 1200
    );
  }
});
</script>
</body>
</html>
